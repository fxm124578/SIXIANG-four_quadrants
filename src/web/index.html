<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<title>四象</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body class="paper">
<!-- 启动加载页：白底遮住主题切换闪烁，文案四句轮播至少 2s，就绪后淡出 -->
<div id="splash">
  <div class="splash-logo"><span></span><span></span><span></span><span></span></div>
  <div class="splash-bar"><i></i></div>
  <div class="splash-text" id="splash-text">无极生太极</div>
</div>
<div class="orb a"></div>
<div class="orb b"></div>
<div class="blob a"></div>
<div class="blob b"></div>
<div class="blob c"></div>
<div class="grid-bg"></div>
<div class="leaf a"></div>
<div class="leaf b"></div>

<div class="widget" id="widget">
  <div class="thread"></div>
  <header class="pywebview-drag-region">
    <h1 style="display:flex;align-items:center;gap:8px">
      <svg width="20" height="20" viewBox="0 0 20 20" style="flex-shrink:0">
        <rect x="1" y="1" width="8" height="8" rx="2" fill="#e5533c"/>
        <rect x="11" y="1" width="8" height="8" rx="2" fill="#e8912d"/>
        <rect x="1" y="11" width="8" height="8" rx="2" fill="#3f7fd9"/>
        <rect x="11" y="11" width="8" height="8" rx="2" fill="#4caf7d"/>
      </svg>
      <span class="app-brand">四象</span>
    </h1>
    <div class="date"><span class="dot"></span><span id="today-date"></span></div>
  </header>
  
  <div class="grid" id="grid">
    <div class="quad q1" data-quadrant="0">
      <div class="q-head"><span class="tint"></span><span class="q-name">紧急且重要</span><span class="q-count" id="count-0">0</span><span class="q-add" data-action="add" data-q="0">＋</span></div>
      <div class="q-tasks" id="tasks-0"></div>
    </div>
    <div class="quad q2" data-quadrant="1">
      <div class="q-head"><span class="tint"></span><span class="q-name">紧急不重要</span><span class="q-count" id="count-1">0</span><span class="q-add" data-action="add" data-q="1">＋</span></div>
      <div class="q-tasks" id="tasks-1"></div>
    </div>
    <div class="quad q3" data-quadrant="2">
      <div class="q-head"><span class="tint"></span><span class="q-name">不紧急重要</span><span class="q-count" id="count-2">0</span><span class="q-add" data-action="add" data-q="2">＋</span></div>
      <div class="q-tasks" id="tasks-2"></div>
    </div>
    <div class="quad q4" data-quadrant="3">
      <div class="q-head"><span class="tint"></span><span class="q-name">不紧急不重要</span><span class="q-count" id="count-3">0</span><span class="q-add" data-action="add" data-q="3">＋</span></div>
      <div class="q-tasks" id="tasks-3"></div>
    </div>
  </div>
  <footer>
    <button class="btn primary" data-action="add-task">＋ 新建任务</button>
    <button class="btn report tag-filter-btn" id="tag-filter-btn" title="标签筛选">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
      筛选
      <span class="tag-filter-btn-count" id="tag-filter-btn-count" style="display:none">0</span>
    </button>
    <button class="btn report" data-action="report">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      日报
    </button>
    <span class="spacer"></span>
    <button class="btn icon-btn" data-action="settings" title="设置">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button class="btn icon-btn" id="lock-btn" data-action="lock" title="锁定">
      <svg id="lock-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>
      </svg>
    </button>
    <button class="btn icon-btn" data-action="minimize" title="最小化">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="6" y1="12" x2="18" y2="12"/>
      </svg>
    </button>
    <button class="btn icon-btn" data-action="quit" title="退出">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
      </svg>
    </button>
  </footer>
</div>

<!-- 标签筛选上拉面板（位于 widget 之外，避免被 overflow:hidden 裁剪） -->
<div class="tag-panel" id="tag-panel">
  <div class="tag-panel-actions">
    <span class="tag-panel-act" onclick="selectAllTags()">全选</span>
    <span class="tag-panel-act" onclick="clearTags()">清空</span>
  </div>
  <div class="tag-panel-list" id="tag-panel-list"></div>
</div>

<script>
/*__THEMES_META__*/
</script>
<script src="app.js"></script>
</body>
</html>
