<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
<title>四象</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai:wght@400;700&family=Noto+Serif+SC:wght@400;600;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
:root{--brand-grad:linear-gradient(90deg,#e5533c,#e8912d,#3f7fd9,#4caf7d)}
/* ================================================================
   公共样式（布局 / 组件 / 动画）。主题样式由启动时从 themes/ 目录
   注入到下方主题占位处，可插拔、可快速安装：
   把 .css 文件放进应用目录 themes/ 文件夹并重启即可。
   ================================================================ */
/*__THEMES_CSS__*/
/* 装饰层默认隐藏：由各主题 CSS 自行启用（body.xxx .orb{display:block} 等） */
.orb,.blob,.grid-bg,.leaf,.thread{display:none}
/* 四象限布局骨架（程序层统一）：两行等高，任务超出在格内滚动，互不挤压；主题只管配色外观 */
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px;flex:1;min-height:0}
.quad{position:relative;display:flex;flex-direction:column;min-height:0}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,-30px) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.35}}
@keyframes morph{from{border-radius:44% 56% 60% 40%/48% 42% 58% 52%;transform:rotate(0)}to{border-radius:58% 42% 44% 56%/40% 58% 42% 60%;transform:rotate(14deg)}}
@keyframes gridmove{from{background-position:0 0,0 0}to{background-position:0 42px,0 0}}
@keyframes boot{from{opacity:0;transform:translateY(22px) skewX(1.5deg)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.2}}
@keyframes settle{from{opacity:0;transform:translateY(30px) rotate(.6deg)}to{opacity:1;transform:none}}





@keyframes stamp{40%{transform:scale(1.35)}100%{transform:scale(1)}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;cursor:default}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
button,a,.q-add,.cb,select,input,textarea,.radio-option,.calendar-grid .day,.nav-btn{-webkit-app-region:no-drag}
.modal-overlay{-webkit-app-region:no-drag}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:38px;padding:0}
.icon-btn svg{pointer-events:none}
.q-tasks{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0}
.task-actions{display:flex;gap:2px;margin-left:4px;opacity:0;transition:opacity .15s;flex-shrink:0}
.task:hover .task-actions{opacity:1}
.icon-btn-sm{display:inline-flex;align-items:center;justify-content:center;width:28px;height:24px;
  border-radius:6px;cursor:pointer;transition:.15s;color:inherit;vertical-align:middle}
.icon-btn-sm:hover{background:rgba(255,255,255,.15)}
.icon-btn-sm.danger:hover{background:rgba(255,80,80,.25);color:#ff6b6b}
.icon-btn-sm svg{pointer-events:none}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
  justify-content:center;z-index:300;opacity:0;animation:fadeIn .25s forwards}
@keyframes fadeIn{to{opacity:1}}
.modal{border-radius:16px;padding:24px;width:420px;max-width:90vw;max-height:85vh;overflow:auto;
  box-shadow:0 30px 60px rgba(0,0,0,.6)}
.modal h2{font-size:16px;font-weight:700;margin-bottom:18px}
.modal label, .drawer label{display:block;font-size:12px;margin-bottom:5px}
.modal input,.modal textarea,.drawer input,.drawer textarea{width:100%;border-radius:8px;padding:8px 10px;margin-bottom:12px;border:1px solid rgba(255,255,255,.12)}
.modal textarea,.drawer textarea{height:70px;resize:vertical}
.modal .radio-group, .drawer .radio-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.modal .radio-option, .drawer .radio-option{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;
  border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:.2s}
.modal .radio-option:hover, .drawer .radio-option:hover{background:rgba(255,255,255,.08)}
.modal .radio-option.selected, .drawer .radio-option.selected{border-color:rgba(91,140,255,.7);background:rgba(91,140,255,.18)}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.modal .hint{font-size:11px;margin-bottom:8px}
.dlg-tag-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px;max-height:66px;overflow-y:auto}
.dlg-tag-chip{font-size:11px;padding:3px 10px;border-radius:99px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid transparent;
  color:inherit;transition:.15s;user-select:none}
.dlg-tag-chip:hover{box-shadow:0 0 0 1.5px var(--q3,#5b8cff)}
.dlg-tag-chip.used{opacity:.4;border-color:transparent;cursor:pointer;box-shadow:none}
.dlg-tag-chip.used:hover{opacity:.6}
.dlg-tag-empty{font-size:10.5px;color:var(--muted)}
.modal,.drawer,
.modal input,.modal textarea,.modal select,.modal button,
.drawer input,.drawer textarea,.drawer select,.drawer button,
.modal label,.drawer label,.modal .radio-option,.drawer .radio-option,
.modal h2,.drawer-header h2{
  font-family:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif}
.modal,.drawer{font-size:13px}
.modal label,.drawer label{font-size:13px}
.modal .radio-option,.drawer .radio-option{font-size:13px}
.modal input,.modal textarea,.drawer input,.drawer textarea{font-size:13px}
.switch{position:relative;display:inline-flex;width:42px;height:24px;flex-shrink:0;cursor:pointer;-webkit-app-region:no-drag;vertical-align:middle}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .slider{position:absolute;inset:0;border-radius:99px;background:rgba(255,255,255,.18);transition:background .25s}
.switch .slider::before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;left:3px;top:3px;background:#fff;transition:transform .25s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.switch input:checked + .slider{background:#5b8cff}
.switch input:checked + .slider::before{transform:translateX(18px)}
.update-card{border:1px solid var(--stroke);border-radius:12px;padding:10px 16px 12px;
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;gap:9px}
.update-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.update-ver{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.update-ver b{font-weight:700}
.update-new{color:var(--q2,#e8912d);font-weight:600;margin-left:6px;white-space:nowrap}
.update-links{display:flex;align-items:center;gap:14px;white-space:nowrap;flex-shrink:0}
.update-link{font-size:11.5px;padding:0;border:none;background:none;
  color:var(--q3,#5b8cff);text-decoration:underline;text-underline-offset:3px;
  cursor:pointer;user-select:none;transition:.15s}
.update-link:hover{color:var(--ink)}
.update-link:disabled{opacity:.4;cursor:default}
.update-link.primary{color:var(--q4,#3dd68c)}
.update-link.primary:hover{color:var(--ink)}
.update-status{font-size:11.5px;line-height:1.7;color:var(--muted);min-height:30px;white-space:pre-wrap}
.update-status.ok{color:var(--q4,#3dd68c)}
.update-status.err{color:#ff6b6b}
.report-modal{display:flex;gap:20px;height:100%;min-height:0}
.report-left{flex:0 0 280px;display:flex;flex-direction:column;overflow-y:auto}
.report-right{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.report-nav{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;z-index:70}
.report-nav-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:inherit;cursor:pointer;transition:.2s;flex-shrink:0;-webkit-app-region:no-drag}
.report-nav-btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
.report-nav-center{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:7px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.12);transition:.2s;user-select:none;-webkit-app-region:no-drag}
.report-nav-center:hover{background:rgba(255,255,255,.08)}
.report-nav-center svg{transition:transform .2s}
.report-date{font-size:13px;font-weight:700;letter-spacing:.03em}
.report-calendar{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:340px;z-index:30;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px;background:rgba(20,24,48,.98);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.drawer-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;
  background:rgba(0,0,0,.45);opacity:0;animation:fadeIn .2s forwards}
.drawer{width:100%;height:78%;min-height:400px;
  display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(100%);animation:slideUp .3s cubic-bezier(.2,.8,.2,1) forwards;
  box-shadow:0 -8px 40px rgba(0,0,0,.4);border-radius:18px 18px 0 0}
@keyframes slideUp{to{transform:translateY(0)}}
.drawer-header{display:flex;align-items:center;padding:18px 24px 14px;flex-shrink:0;gap:12px;
  position:relative;z-index:60}
.drawer-header h2{margin:0;flex:1;font-size:16px;font-weight:700}
.drawer-body{flex:1;display:flex;gap:20px;padding:0 24px 18px;overflow:hidden;min-height:0}
.drawer-footer{display:flex;align-items:center;gap:8px;padding:12px 24px 16px;flex-shrink:0}
.calendar-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calendar-nav .nav-btn{font-size:15px;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer;background:none;border:1px solid rgba(255,255,255,.12)}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calendar-grid .weekday{font-size:11px;text-align:center;padding:4px 0}
.calendar-grid .day{font-size:12px;text-align:center;padding:7px 4px;border-radius:8px;cursor:pointer;transition:.2s}
.calendar-grid .day:hover{background:rgba(255,255,255,.12)}
.calendar-grid .day.today{outline:1px solid var(--border);outline-offset:-1px}
.calendar-grid .day.today{outline:1.5px solid #8a93b0}
.calendar-grid .day.selected{background:#4f7df9;color:#fff}
.calendar-grid .day.completed{background:#4caf7d;color:#fff}
.report-table{flex:1;overflow-y:auto;min-height:0}
.report-table table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.report-table th{padding:7px 8px;text-align:center;font-weight:600;border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
.report-table td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle;word-break:break-all}
.report-table td:nth-child(-n+4),.report-table td:nth-child(6){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal}
.report-tags{display:flex;flex-wrap:wrap;gap:4px}
.report-table tr:hover{background:rgba(255,255,255,.04)}
.report-table tr:nth-child(even){background:rgba(255,255,255,.02)}
.report-hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.hero-card{position:relative;overflow:hidden;border-radius:14px;padding:15px 18px 13px 20px;
  background:var(--glass);border:1px solid var(--stroke);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero-card .hero-bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.hero-card .hero-num{font-size:23px;font-weight:700;line-height:1.2;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.hero-card .hero-label{font-size:11px;color:var(--muted);margin-top:5px}
.report-charts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.chart-card{border-radius:14px;padding:14px 16px;background:var(--glass);
  border:1px solid var(--stroke);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chart-card.full{grid-column:1/-1}
.chart-card h3{font-size:12.5px;font-weight:700;margin-bottom:12px;
  display:flex;align-items:center;gap:7px}
.chart-card h3::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--q3,#5b8cff)}
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut-num{font-size:28px;font-weight:700;fill:currentColor}
.donut-cap{font-size:11px;fill:var(--muted)}
.legend{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.legend-row{display:flex;align-items:center;gap:8px;font-size:12px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend-val{font-weight:700;min-width:20px;text-align:right}
.legend-pct{color:var(--muted);font-size:11px;width:38px;text-align:right}
.tbar-row{display:flex;align-items:center;gap:9px;font-size:12px;margin-bottom:8px}
.tbar-name{width:70px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbar-track{flex:1;height:9px;border-radius:5px;background:rgba(128,136,160,.18);overflow:hidden}
.tbar-fill{height:100%;border-radius:5px}
.tbar-val{width:24px;text-align:right;font-weight:700}
.horbars{display:flex;align-items:flex-end;gap:14px;height:130px;padding:0 4px}
.hbar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;
  justify-content:flex-end;gap:6px}
.hbar{width:100%;max-width:46px;border-radius:6px 6px 3px 3px;background:var(--q3,#5b8cff);min-height:2px}
.hbar-val{font-size:11px;font-weight:700;color:var(--muted)}
.hbar-label{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.3}
.hbar-col.empty .hbar{background:rgba(128,136,160,.14)}
.hbar-col.empty .hbar-val{color:rgba(128,136,160,.4)}
.chart-empty{color:var(--muted);font-size:12px;padding:12px 2px}
.report-tabs{display:flex;justify-content:center;align-items:center;gap:12px;
  margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--stroke)}
.report-tab{display:flex;align-items:center;padding:5px 16px;border-radius:12px;
  cursor:pointer;transition:.2s;user-select:none;-webkit-app-region:no-drag;
  border:1px solid transparent}
.report-tab:hover{background:rgba(255,255,255,.07)}
.report-tab .report-overview-title{font-size:15px;color:var(--muted);flex:1;justify-content:center}
.report-tab .report-overview-title::before,
.report-tab .report-overview-title::after{opacity:.35;box-shadow:none}
.report-tab.active{background:var(--glass);border-color:var(--stroke)}
.report-tab.active .report-overview-title{color:var(--ink)}
.report-tab.active .report-overview-title::before,
.report-tab.active .report-overview-title::after{opacity:1}
.report-overview-title{font-size:16px;font-weight:700;letter-spacing:.08em;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:9px;color:var(--ink)}
.report-overview-title::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--q2,#e8912d);
  box-shadow:0 0 8px var(--q2,#e8912d)}
.report-overview-title::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--q4,#3dd68c);
  box-shadow:0 0 8px var(--q4,#3dd68c)}
.report-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:52px 0;color:var(--muted);gap:10px}
.report-empty .sub{font-size:11.5px;opacity:.75}
.report-empty svg{opacity:.5}
#splash{position:fixed;inset:0;z-index:9999;background:#ffffff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  transition:opacity .35s ease;cursor:default}
#splash.hide{opacity:0;pointer-events:none}
#splash .splash-logo{display:flex;gap:7px}
#splash .splash-logo span{width:26px;height:26px;border-radius:6px;animation:splashPulse 1.1s ease-in-out infinite}
#splash .splash-logo span:nth-child(1){background:#e5533c;animation-delay:0s}
#splash .splash-logo span:nth-child(2){background:#e8912d;animation-delay:.12s}
#splash .splash-logo span:nth-child(3){background:#3f7fd9;animation-delay:.24s}
#splash .splash-logo span:nth-child(4){background:#4caf7d;animation-delay:.36s}
@keyframes splashPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}}
#splash .splash-bar{width:120px;height:3px;border-radius:3px;background:#f0f2f7;overflow:hidden}
#splash .splash-bar i{display:block;height:100%;width:40%;border-radius:3px;
  background:linear-gradient(90deg,#e5533c,#e8912d,#3f7fd9,#4caf7d);
  animation:splashSlide 1.2s ease-in-out infinite}
@keyframes splashSlide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
#splash .splash-text{font-size:13px;color:#9aa3b5;letter-spacing:.14em;transition:opacity .15s ease}
.app-brand,.splash-brand{
  background:var(--brand-grad);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}
#splash .splash-text .splash-brand{
  font-weight:700;letter-spacing:.06em}
#splash .splash-text .splash-line-lg{font-size:2em}
.tag-filter-btn{
  display: inline-flex;
  align-items: center;
  gap: 5px;
  position: relative;
  cursor: pointer;
  user-select: none;
  background: transparent;
  box-shadow: none;
}
.tag-filter-btn svg{ flex-shrink: 0; }
.tag-filter-btn.active{ border-color: currentColor; }
.tag-filter-btn-count{
  font-size: 9px;
  min-width: 15px;
  height: 15px;
  padding: 0 3px;
  border-radius: 8px;
  background: var(--q3);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
}
.tag-panel{
  position: fixed;
  right: 14px;
  bottom: 52px;
  width: 280px;
  max-height: 240px;
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.4);
  padding: 12px;
  display: none;
  z-index: 30;
  flex-direction: column;
  gap: 8px;
}
.tag-panel.open{ display: flex; animation: rise 0.22s ease; }
.tag-panel-actions{
  display: flex;
  align-items: center;
  gap: 10px;
}
.tag-panel-act{
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  padding: 3px 8px;
  border-radius: 6px;
  transition: 0.2s;
}
.tag-panel-act:hover{ color: var(--ink); background: rgba(255,255,255,0.1); }
.tag-panel-list{
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 170px;
  overflow-y: auto;
  scrollbar-width: thin;
}
.tag-panel-item{
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: 0.15s;
  user-select: none;
  flex-shrink: 0;
}
.tag-panel-item:hover{ background: rgba(255,255,255,0.08); }
.tag-panel-item .ck{
  width: 16px;
  height: 16px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  opacity: 0.45;
  transition: opacity 0.15s;
}
.tag-panel-item .ck svg{ width: 16px; height: 16px; }
.tag-panel-item.selected{ font-weight: 600; }
.tag-panel-item.selected .ck{ opacity: 1; }
.tag-panel-empty{ font-size: 11px; color: var(--muted); padding: 6px 2px; }
</style>
</head>
<body class="paper">
<!-- 启动加载页：白底遮住主题切换闪烁，文案四句轮播至少 2s，就绪后淡出 -->
<div id="splash">
  <div class="splash-logo"><span></span><span></span><span></span><span></span></div>
  <div class="splash-bar"><i></i></div>
  <div class="splash-text" id="splash-text">无极生太极</div>
</div>
<div class="orb a"></div>
<div class="orb b"></div>
<div class="blob a"></div>
<div class="blob b"></div>
<div class="blob c"></div>
<div class="grid-bg"></div>
<div class="leaf a"></div>
<div class="leaf b"></div>

<div class="widget" id="widget">
  <div class="thread"></div>
  <header class="pywebview-drag-region">
    <h1 style="display:flex;align-items:center;gap:8px">

<!-- 标签筛选上拉面板（位于 widget 之外，避免被 overflow:hidden 裁剪） -->
<div class="tag-panel" id="tag-panel">
  <div class="tag-panel-actions">
    <span class="tag-panel-act" onclick="selectAllTags()">全选</span>
    <span class="tag-panel-act" onclick="clearTags()">清空</span>

  <div class="tag-panel-list" id="tag-panel-list"></div>

<script>
/*__THEMES_META__*/
/* ================================================================
   pywebview API 桥
   ================================================================ */
let api = null;
const QUADRANT_NAMES = ['紧急且重要','紧急不重要','不紧急重要','不紧急不重要'];
const QUADRANT_COLORS = ['#e5533c','#e8912d','#3f7fd9','#4caf7d'];
const WEEKDAYS = ['周一','周二','周三','周四','周五','周六','周日'];
const HOUR_SLOTS = [['深夜','0-4'],['清晨','4-8'],['上午','8-12'],['下午','12-16'],['傍晚','16-20'],['夜晚','20-24']];
/* 主题清单：启动时由 Python 从 themes/ 目录注入（可插拔）；浏览器直开为空 */
const THEME_LIST = window.__PROMATHEMES__ || [];
const DEFAULT_THEME = (THEME_LIST.find(t => t.default === '1') || {}).id || 'paper';

window.addEventListener('pywebviewready', async () => {
  api = window.pywebview.api;
  applyDate();
  setInterval(applyDate, 30000); // 时钟每分钟刷新（30s 间隔保证整分后尽快更新）
  startUpdateMonitor(); // 后台更新监控：下载完成后弹窗提示
  const st = await api.get_settings();
  isLocked = st.locked === '1';
  updateLockUI();
  applyTheme(st.theme || DEFAULT_THEME);
  await refreshAll();
  await loadAllTags();
  // 主题与内容就绪后再淡出加载页，避免主题切换闪烁
  hideSplash();
});

// 加载页文案三句轮播（每句 1s，至少轮播 3s）
const SPLASH_LINES = ['无极生太极','太极生两仪','两仪生四象'];
const splashStart = Date.now();
let splashTimer = null;
function splashLineHtml(line) {
  // 「四象」品牌字用四色渐变高亮；第三句「两仪生四象」整句放大 2 倍
  const brand = line.replace('四象', '<span class="splash-brand">四象</span>');
  return line === '两仪生四象' ? `<span class="splash-line-lg">${brand}</span>` : brand;
}
function startSplashRotation() {
  const el = document.getElementById('splash-text');
  if (!el) return;
  let idx = 0;
  splashTimer = setInterval(() => {
    idx = (idx + 1) % SPLASH_LINES.length;
    el.style.opacity = '0';
    setTimeout(() => {
      el.innerHTML = splashLineHtml(SPLASH_LINES[idx]);
      el.style.opacity = '1';
    }, 150);
    // 三句各 1s 播完一遍即停止，之后停留在最后一句（共 3s）
    if (idx >= SPLASH_LINES.length - 1) {
      clearInterval(splashTimer);
      splashTimer = null;
    }
  }, 1000);
}
startSplashRotation();

function hideSplash() {
  const splash = document.getElementById('splash');
  if (!splash || splash.classList.contains('hide')) return;
  // 加载文案至少轮播 3s 再淡出：淡出那一刻才停止轮播，避免提前打断（超过 3s 则停留在最后一句）
  const delay = Math.max(0, 3000 - (Date.now() - splashStart));
  setTimeout(() => {
    if (splashTimer) { clearInterval(splashTimer); splashTimer = null; }
    splash.classList.add('hide');
    setTimeout(() => { if (splash.parentNode) splash.remove(); }, 400);
  }, delay);
}
// 非 pywebview 环境（如浏览器直接打开）兜底隐藏加载页
setTimeout(() => { if (!api) hideSplash(); }, 3000);

function applyDate() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  // 顶部小字：日期 + 星期 + 当前时间（24 小时制）；版本号只在设置中显示
  document.getElementById('today-date').textContent =
    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${WEEKDAYS[(d.getDay()+6)%7]} · ${hh}:${mm}`;
}

/* ================================================================
   主题切换
   ================================================================ */
function applyTheme(theme) {
  document.body.className = theme;
}

function onThemeSelect(themeId) {
  // 下拉选择即时预览（保存后持久化，重启由 Python 注入对应主题 CSS）
  applyTheme(themeId);
}

async function importThemeFile(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  input.value = '';
  try {
    const text = await f.text();
    const r = await api.import_theme(f.name, text);
    if (!r.ok) { alert(r.error || '导入失败'); return; }
    // 新主题 CSS 立即注入页面（无需重启即可预览）
    const style = document.createElement('style');
    style.id = 'theme-imported-' + r.id;
    style.textContent = text;
    document.head.appendChild(style);
    // 刷新主题清单 + 下拉选项 + 应用新主题
    const list = await api.get_theme_list();
    window.__PROMATHEMES__ = list;
    const sel = document.getElementById('set-theme-select');
    if (sel) {
      const cur = sel.value;
      sel.innerHTML = list.map(t =>
        `<option value="${t.id}"${t.id===r.id?' selected':''}>${esc(t.name)}${t.default==='1'?'（默认）':''}${t.builtin==='1'?'':' · 自定义'}</option>`
      ).join('') + (list.length === 0 ? '<option value="paper">晨雾纸墨（默认）</option>' : '');
      applyTheme(r.id);
      onThemeSelect(r.id);
      alert('主题已导入：' + (list.find(x=>x.id===r.id)||{}).name + '（重启后仍会保留）');
    }
  } catch (e) {
    alert('导入失败：' + e.message);
  }
}

/* ================================================================
   渲染
   ================================================================ */
async function refreshAll() {
  if (!api) return;
  const tasks = await api.get_active_tasks();
  // 标签筛选（多选：任务需包含任一选中标签）
  let filteredTasks = tasks;
  if (selectedTags.length > 0) {
    filteredTasks = tasks.filter(t => {
      const tags = parseTags(t.tag);
      return tags.some(tg => selectedTags.includes(tg));
    });
  }
  const byQ = {0:[],1:[],2:[],3:[]};
  filteredTasks.forEach(t => { if (byQ[t.quadrant]) byQ[t.quadrant].push(t); });
  for (let q = 0; q < 4; q++) renderQuadrant(q, byQ[q]);
}

function renderQuadrant(q, tasks) {
  const container = document.getElementById(`tasks-${q}`);
  document.getElementById(`count-${q}`).textContent = tasks.length;
  container.innerHTML = tasks.map(t => {
    const tags = parseTags(t.tag);
    // 标签筛选生效时，任务行只展示被勾选的标签
    let shownTags = tags;
    if (selectedTags.length > 0) shownTags = tags.filter(tg => selectedTags.includes(tg));
    const tagHTML = shownTags.slice(0,2).map((tg,i) => tagSpan(tg, i)).join('')
      + (shownTags.length > 2 ? `<span class="tag" style="opacity:.7">+${shownTags.length-2}</span>` : '');
    return `<div class="task" draggable="true" data-id="${t.id}" data-quadrant="${q}"
      ondragstart="onDragStart(event)" ondragend="onDragEnd(event)" onclick="openDetail(${t.id})">
      <span class="cb" onclick="event.stopPropagation();completeTask(${t.id},this)"><svg viewBox="0 0 12 10" fill="none"><path d="M1 5.5 4.2 8.5 11 1.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg></span>
      <span class="t-title">${esc(t.title)}</span>
      ${tagHTML ? `<div class="tags">${tagHTML}</div>` : ''}
    </div>`;
  }).join('');
}

function parseTags(raw) {
  if (!raw || !raw.trim()) return [];
  try { const a = JSON.parse(raw); return Array.isArray(a) ? a.filter(x => String(x).trim()).map(String) : [raw]; }
  catch { return [raw]; }
}

/* 多标签配色：按索引循环分配颜色，浅底深字保证四主题下高对比可读 */
const TAG_PALETTE = [
  ['#5b4bb5', '#e8e3ff'], ['#8a5a10', '#fff0d4'], ['#2e7d52', '#dcf5e8'],
  ['#2f6fc4', '#dcebff'], ['#b04a3c', '#fde3de'], ['#a83e80', '#fde3f2'],
];
function tagSpan(tg, idx) {
  const [fg, bg] = TAG_PALETTE[idx % TAG_PALETTE.length];
  return `<span class="tag" style="background:${bg};color:${fg}">${esc(tg)}</span>`;
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ================================================================
   标签筛选（上拉面板 · 多选）
   ================================================================ */
let selectedTags = []; // 当前选中的标签集合，空数组 = 显示所有
let allTags = []; // 所有标签列表

async function loadAllTags() {
  if (!api) return;
  try {
    allTags = await api.get_all_tags();
    renderTagPanel();
    updateTagFilterBtn();
    renderTagChips();
  } catch(e) {
    console.error('加载标签失败:', e);
  }
}

function renderTagPanel() {
  const container = document.getElementById('tag-panel-list');
  if (!container) return;
  if (allTags.length === 0) {
    container.innerHTML = '<div class="tag-panel-empty">暂无标签</div>';
    return;
  }
  container.innerHTML = allTags.map(tag => {
    const sel = selectedTags.includes(tag);
    return `<span class="tag-panel-item ${sel ? 'selected' : ''}" onclick="toggleTag('${esc(tag)}')">
      <span class="ck">${sel
        ? '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M5 8.5l2 2 4-4.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>'}
      </span>${esc(tag)}
    </span>`;
  }).join('');
}

function toggleTag(tag) {
  const i = selectedTags.indexOf(tag);
  if (i >= 0) selectedTags.splice(i, 1);
  else selectedTags.push(tag);
  renderTagPanel();
  updateTagFilterBtn();
  refreshAll();
}

function selectAllTags() {
  selectedTags = [...allTags];
  renderTagPanel();
  updateTagFilterBtn();
  refreshAll();
}

function clearTags() {
  selectedTags = [];
  renderTagPanel();
  updateTagFilterBtn();
  refreshAll();
}

function updateTagFilterBtn() {
  const btn = document.getElementById('tag-filter-btn');
  const count = document.getElementById('tag-filter-btn-count');
  if (!btn) return;
  if (selectedTags.length > 0 && selectedTags.length < allTags.length) {
    btn.classList.add('active');
    if (count) { count.style.display = 'inline-flex'; count.textContent = selectedTags.length; }
  } else {
    btn.classList.remove('active');
    if (count) count.style.display = 'none';
  }
}

function toggleTagPanel() {
  const panel = document.getElementById('tag-panel');
  const btn = document.getElementById('tag-filter-btn');
  if (!panel || !btn) return;
  if (panel.classList.contains('open')) {
    panel.classList.remove('open');
    return;
  }
  // 动态定位：面板左缘对齐按钮左缘，向上弹出，保证不出屏
  const rect = btn.getBoundingClientRect();
  const panelW = 280;
  let left = rect.left;
  if (left + panelW > window.innerWidth - 12) left = window.innerWidth - panelW - 12;
  if (left < 12) left = 12;
  panel.style.left = left + 'px';
  panel.style.right = 'auto';
  panel.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
  panel.classList.add('open');
  // 加载标签数据（如果还没加载）
  if (allTags.length > 0) renderTagPanel();
  else loadAllTags();
}

// 点击外部关闭面板
// 用 mousedown 判断（在 click 之前触发）：toggleTag 的 renderTagPanel 会替换面板内 DOM，
// 导致 click 冒泡时 e.target 已脱离面板，误判为外部点击而关闭弹窗。
// mousedown 时 DOM 尚未变化，panel.contains 判断准确；另用坐标判断双保险。
document.addEventListener('mousedown', e => {
  const panel = document.getElementById('tag-panel');
  const btn = document.getElementById('tag-filter-btn');
  if (panel && panel.classList.contains('open')) {
    const rect = panel.getBoundingClientRect();
    const inPanel = e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom;
    if (inPanel || (btn && btn.contains(e.target))) return;
    panel.classList.remove('open');
  }
});

/* ================================================================
   拖拽
   ================================================================ */
let dragId = null;
function onDragStart(e) {
  dragId = e.currentTarget.dataset.id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragId);
}
function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); dragId = null; }
async function onDrop(e, q) {
  e.preventDefault();
  const id = dragId || e.dataTransfer.getData('text/plain');
  if (!id) return;
  await api.set_quadrant(parseInt(id), q);
  await refreshAll();
}
document.querySelectorAll('.quad').forEach(el => {
  el.addEventListener('dragover', e => e.preventDefault());
  el.addEventListener('drop', e => onDrop(e, parseInt(el.dataset.quadrant)));
});

/* ================================================================
   任务操作
   ================================================================ */
async function completeTask(id, el) {
  el.classList.add('checked');
  await api.complete_task(id);
  setTimeout(refreshAll, 250);
}

async function deleteTask(id, title) {
  if (!confirm(`确定删除「${title}」？`)) return;
  await api.delete_task(id);
  await refreshAll();
}

async function deleteReportTask(id, title) {
  if (!confirm(`确定删除「${title}」？`)) return;
  await api.delete_task(id);
  // 刷新日报内容和日历标记
  completedDatesCache = await api.get_completed_dates();
  loadReportDay(fmtDate(reportDate));
}

async function uncompleteReportTask(id, title) {
  if (!confirm(`确定将「${title}」恢复为未完成？任务将回到四象限主页。`)) return;
  await api.uncomplete_task(id);
  // 刷新日报内容和日历标记，同时刷新主页（任务回到四象限）
  completedDatesCache = await api.get_completed_dates();
  loadReportDay(fmtDate(reportDate));
  refreshAll();
}

/* 任务抽屉公共骨架（新建/编辑共用） */
const DRAWER_SAVE_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>';
const DRAWER_ADD_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
function taskDrawerShell({titleText, submitText, submitIcon, titleValue='', descValue='', tagsValue='', defaultQuad=0, completedHTML='', hintText='ctrl + ↩︎ 快速保存'}) {
  return `<div class="drawer" style="height:480px;min-height:400px;max-height:80vh" onclick="event.stopPropagation()">
      <div class="drawer-header" style="padding-top:24px">
        <h2>${titleText}</h2>
        <span style="flex:1"></span>
        <span class="icon-btn-sm" onclick="closeDrawer()" title="关闭">${ICON_SVGS.close}</span>
      </div>
      <div class="drawer-body" style="gap:22px;padding-top:16px">
        <div style="flex:3;display:flex;flex-direction:column;min-width:0">
          <label>标题 *</label>
          <input id="dlg-title" maxlength="80" value="${esc(titleValue)}" style="margin-bottom:12px">
          <label>描述</label>
          <textarea id="dlg-desc" style="flex:1;min-height:88px;margin-bottom:12px">${esc(descValue)}</textarea>
          <label>标签 <span style="opacity:.45;font-size:10px;font-weight:400;letter-spacing:.02em">多个标签用逗号或空格分隔</span></label>
          <input id="dlg-tags" value="${esc(tagsValue)}" style="margin-bottom:8px">
          <div id="dlg-tag-chips" class="dlg-tag-chips"></div>
          ${completedHTML}
          <div class="hint" style="margin-bottom:0;font-size:10px;color:var(--muted);opacity:.72;text-align:right">${hintText}</div>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;min-width:0">

/* 新建任务抽屉：历史标签快速点选 */
function addTagToInput(tag) {
  const input = document.getElementById('dlg-tags');
  if (!input) return;
  const existing = input.value.split(/[,，;；、\s]+/).filter(Boolean);
  if (existing.includes(tag)) return;
  existing.push(tag);
  input.value = existing.join(' ');
  renderTagChips();
}

function removeTagFromInput(tag) {
  // 取消选择：仅移除该标签，保留输入框中其他已输入的标签文本
  const input = document.getElementById('dlg-tags');
  if (!input) return;
  const existing = input.value.split(/[,，;；、\s]+/).filter(Boolean);
  const idx = existing.indexOf(tag);
  if (idx < 0) return;
  existing.splice(idx, 1);
  input.value = existing.join(' ');
  renderTagChips();
}

function renderTagChips() {
  const box = document.getElementById('dlg-tag-chips');
  if (!box) return;
  const input = document.getElementById('dlg-tags');
  const existing = input ? input.value.split(/[,，;；、\s]+/).filter(Boolean) : [];
  if (!allTags.length) {
    box.innerHTML = '<span class="dlg-tag-empty">暂无历史标签</span>';
    return;
  }
  // 按任务标签配色展示胶囊；已加入输入框的胶囊变淡，再次点击可取消选择
  box.innerHTML = allTags.map((tag, i) => {
    const used = existing.includes(tag);
    const [fg, bg] = TAG_PALETTE[i % TAG_PALETTE.length];
    const style = used
      ? `background:${bg};color:${fg};opacity:.38`
      : `background:${bg};color:${fg}`;
    const fn = used ? 'removeTagFromInput' : 'addTagToInput';
    return `<span class="dlg-tag-chip${used ? ' used' : ''}" style="${style}" onclick="${fn}('${esc(tag).replace(/'/g,"\\'")}')">${esc(tag)}</span>`;
  }).join('');
}

/* ================================================================
   检查更新（GitHub Releases）
   ================================================================ */
let updateTimer = null;
function clearUpdatePoll() { if (updateTimer) { clearInterval(updateTimer); updateTimer = null; } }

async function checkUpdate() {
  if (!api) return;
  clearUpdatePoll();
  const btn = document.getElementById('btn-check-update');
  const status = document.getElementById('update-status');
  // 本地已有下载好的新包：直接提示就绪，不再重复检查/下载
  try {
    const st0 = await api.get_update_state();
    if (st0 && st0.phase === 'ready') { renderUpdateState(st0); return; }
  } catch(e) { /* 继续常规检查 */ }
  if (btn) btn.disabled = true;
  if (status) status.textContent = '正在检查更新…';
  try { await api.start_check_update(); }
  catch(e) { if (status) status.textContent = '检查失败：' + e.message; if (btn) btn.disabled = false; return; }
  updateTimer = setInterval(async () => {
    let st;
    try { st = await api.get_update_state(); } catch(e) { return; }
    renderUpdateState(st);
  }, 500);
}

function renderUpdateState(st) {
  const status = document.getElementById('update-status');
  const checkBtn = document.getElementById('btn-check-update');
  const dlBtn = document.getElementById('btn-download-update');
  const applyBtn = document.getElementById('btn-apply-update');
  const newBadge = document.getElementById('update-new');
  if (!status) return;
  status.classList.remove('ok', 'err');
  if (st.phase === 'checking') {
    if (checkBtn) checkBtn.disabled = true;
    status.textContent = '正在检查更新…';
  } else if (st.phase === 'error') {
    if (checkBtn) checkBtn.disabled = false;
    if (dlBtn) { dlBtn.style.display = 'none'; dlBtn.textContent = '下载并更新'; }
    if (applyBtn) applyBtn.style.display = 'none';
    clearUpdatePoll();
    status.classList.add('err');
    status.textContent = st.error || '更新出错，请稍后重试';
  } else if (st.phase === 'result') {
    if (checkBtn) checkBtn.disabled = false;
    clearUpdatePoll();
    if (st.has_update) {
      if (newBadge) { newBadge.style.display = ''; newBadge.innerHTML = `（检测到新版本 <b>v${esc(st.latest_version)}</b>）`; }
      const notes = (st.notes || '').split('\n').filter(Boolean).slice(0, 6).map(s => esc(s)).join('\n');
      status.innerHTML = notes ? notes : '已找到新版本，可点击下方按钮下载';
      if (dlBtn) { dlBtn.style.display = ''; dlBtn.disabled = false; dlBtn.textContent = '下载并更新'; }
      if (applyBtn) applyBtn.style.display = 'none';
    } else {
      if (newBadge) newBadge.style.display = 'none';
      if (dlBtn) dlBtn.style.display = 'none';
      if (applyBtn) applyBtn.style.display = 'none';
      status.classList.add('ok');
      status.textContent = `已是最新版本 v${st.current_version}`;
    }
  } else if (st.phase === 'downloading') {
    if (checkBtn) checkBtn.disabled = true;
    if (dlBtn) { dlBtn.disabled = true; dlBtn.textContent = '下载中…'; }
    status.textContent = `正在下载更新… ${Math.round(st.progress)}%`;
  } else if (st.phase === 'ready') {
    if (checkBtn) checkBtn.disabled = false;
    if (dlBtn) dlBtn.style.display = 'none';
    clearUpdatePoll();
    status.classList.add('ok');
    status.textContent = '更新已下载完成，点击「立即重启更新」安装（将关闭当前窗口，自动以「SIXIANG.exe」重新打开）';
    if (applyBtn) { applyBtn.style.display = ''; applyBtn.disabled = false; }
  } else if (st.phase === 'applying') {
    status.textContent = '正在应用更新，程序即将重启…';
  } else {
    status.textContent = '尚未检查更新，点击上方按钮开始';
  }
}

async function downloadUpdate() {
  const status = document.getElementById('update-status');
  const dlBtn = document.getElementById('btn-download-update');
  if (status) status.textContent = '准备下载…';
  if (dlBtn) { dlBtn.disabled = true; dlBtn.textContent = '下载中…'; }
  clearUpdatePoll();
  updateReadyPrompted = false; // 新一轮下载完成后可再次弹窗
  startUpdateMonitor();
  try { await api.start_download_update(); }
  catch(e) {
    if (status) status.textContent = '下载失败：' + e.message;
    if (dlBtn) { dlBtn.disabled = false; dlBtn.textContent = '下载并更新'; }
    return;
  }
  updateTimer = setInterval(async () => {
    let st;
    try { st = await api.get_update_state(); } catch(e) { return; }
    renderUpdateState(st);
  }, 500);
}

async function applyUpdateNow() {
  const status = document.getElementById('update-status');
  if (status) status.innerHTML = '<div style="color:#3dd68c">正在应用更新，程序即将重启…</div>';
  clearUpdatePoll();
  try {
    const r = await api.apply_update();
    if (r && r.ok === false) { if (status) status.textContent = (r.error || '更新失败') + '（请稍后重试）'; }
  } catch(e) { if (status) status.textContent = '应用更新失败：' + e.message; }
}

/* 后台更新监控：设置页关闭后仍持续轮询，下载完成弹窗询问是否立即更新 */
let updateMonitorTimer = null;
let updateReadyPrompted = false;
function startUpdateMonitor() {
  if (updateMonitorTimer) return;
  const stop = () => { clearInterval(updateMonitorTimer); updateMonitorTimer = null; };
  updateMonitorTimer = setInterval(async () => {
    let st;
    try { st = await api.get_update_state(); } catch(e) { return; }
    if (!st) return;
    if (st.phase === 'ready') {
      if (updateReadyPrompted) { stop(); return; }
      // 设置抽屉打开时由抽屉内轮询展示状态，等关闭后再弹窗
      if (document.getElementById('update-status')) return;
      updateReadyPrompted = true;
      stop();
      showUpdateReadyModal();
      return;
    }
    // 非下载/检查中的状态无需继续监控，停止轮询
    if (st.phase !== 'downloading' && st.phase !== 'checking') stop();
  }, 2000);
}

function showUpdateReadyModal() {
  showModal('更新已就绪', `
    <div style="font-size:13px;line-height:1.8">
      新版本已下载完成，是否现在更新？<br>
      <span style="font-size:11px;color:var(--muted)">现在更新会关闭当前窗口，自动以「SIXIANG.exe」重新打开；选择稍后，可随时在设置中点击「立即重启更新」。</span>
    </div>`,
    [
      {text:'稍后再说', action:'close'},
      {text:'现在更新', action:'noop', primary:true, handler: async () => {
        closeModal();
        await applyUpdateNow();
      }},
    ]);
}

function updateReportNavDate() {
  const el = document.querySelector('.report-date');
  if (el) el.textContent = fmtDate(reportDate) + ' ' + WEEKDAYS[(reportDate.getDay() + 6) % 7];
}

function renderCalendar() {
  const sel = fmtDate(reportDate);
  const today = fmtDate(new Date());
  const monthLabel = document.querySelector('.report-calendar .cal-month');
  const grid = document.getElementById('cal-grid');
  if (monthLabel) monthLabel.textContent = `${calYear} 年 ${calMonth + 1} 月`;
  if (grid) grid.innerHTML = '一二三四五六日'.split('').map(d => `<div class="weekday">${d}</div>`).join('') + buildCalendarCells(calYear, calMonth, sel, today);
}

function buildCalendarCells(y, m, sel, today) {
  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  let html = '';
  for (let i = 0; i < 42; i++) {
    const d = new Date(y, m, 1 - offset + i);
    const ds = fmtDate(d);
    const inMonth = d.getMonth() === m;
    if (!inMonth && (i - offset >= daysInMonth || i < offset)) { html += `<div class="day" style="visibility:hidden">0</div>`; continue; }
    const cls = ['day'];
    if (ds === today) cls.push('today');
    if (ds === sel) cls.push('selected');
    if (completedDatesCache.includes(ds)) cls.push('completed');
    html += `<div class="${cls.join(' ')}" onclick="selectReportDay('${ds}')">${d.getDate()}</div>`;
  }
  return html;
}

function selectReportDay(ds) {
  reportDate = parseDate(ds);
  hideCalendar();
  updateReportNavDate();
  loadReportDay(ds);
}

function computeReportStats(tasks) {
  const byQ = [0,0,0,0], byTag = {}, hours = new Array(24).fill(0);
  tasks.forEach(t => {
    byQ[t.quadrant] = (byQ[t.quadrant]||0) + 1;
    (parseTags(t.tag)||['（无标签）']).forEach(tg => byTag[tg]=(byTag[tg]||0)+1);
    const hm = (t.completed_at||'').split(' ')[1];
    if (hm) {
      const h = parseInt(hm.split(':')[0], 10);
      if (!isNaN(h) && h >= 0 && h < 24) hours[h]++;
    }
  });
  const slots = HOUR_SLOTS.map((_, i) => hours.slice(i*4, i*4+4).reduce((a,b)=>a+b, 0));
  const tagCount = Object.keys(byTag).length;
  let peak = null;
  slots.forEach((c, i) => { if (c > 0 && (!peak || c > peak.count)) peak = {count: c, name: HOUR_SLOTS[i][0] + ' ' + HOUR_SLOTS[i][1]}; });
  const times = tasks.map(t => t.completed_at).filter(Boolean).sort();
  let avgMin = null;
  if (times.length >= 2) {
    let total = 0;
    for (let i = 1; i < times.length; i++) {
      total += (new Date(times[i].replace(' ','T')) - new Date(times[i-1].replace(' ','T'))) / 60000;
    }
    avgMin = Math.round(total / (times.length - 1));
  }
  return {total: tasks.length, byQ, byTag, slots, tagCount, peak, avgMin};
}

function fmtInterval(m) {
  if (m == null) return '—';
  if (m < 1) return '<1 分钟';
  if (m < 60) return m + ' 分钟';
  const h = Math.floor(m / 60), r = m % 60;
  return r ? `${h} 小时 ${r} 分` : `${h} 小时`;
}

function cardsHTML(stats) {
  const cards = [
    {num: stats.total, label: '完成任务', color: QUADRANT_COLORS[3]},
    {num: stats.tagCount, label: '涉及标签', color: QUADRANT_COLORS[2]},
    {num: stats.peak ? stats.peak.name : '—', label: '高峰时段', color: QUADRANT_COLORS[1]},
    {num: fmtInterval(stats.avgMin), label: '平均完成间隔', color: QUADRANT_COLORS[0]},
  ];
  return `<div class="report-hero">` + cards.map(c =>
    `<div class="hero-card"><span class="hero-bar" style="background:${c.color}"></span>` +
    `<div class="hero-num">${esc(String(c.num))}</div><div class="hero-label">${c.label}</div></div>`
  ).join('') + `</div>`;
}

function donutHTML(stats) {
  const size = 168, stroke = 22;
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, cx = size / 2;
  let acc = 0, circles = '';
  for (let q = 0; q < 4; q++) {
    const v = stats.byQ[q] || 0;
    if (v <= 0) continue;
    const frac = v / stats.total;
    const len = frac * c;
    circles += `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${QUADRANT_COLORS[q]}" ` +
      `stroke-width="${stroke}" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" ` +
      `transform="rotate(${(acc*360-90).toFixed(2)} ${cx} ${cx})"/>`;
    acc += frac;
  }
  const legend = QUADRANT_NAMES.map((n, q) => {
    const v = stats.byQ[q] || 0;
    const pct = stats.total ? Math.round(v / stats.total * 100) : 0;
    return `<div class="legend-row"><span class="legend-dot" style="background:${QUADRANT_COLORS[q]}"></span>` +
      `<span class="legend-name">${n}</span><span class="legend-val">${v}</span>` +
      `<span class="legend-pct">${pct}%</span></div>`;
  }).join('');
  return `<div class="donut-wrap">` +
    `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="donut">${circles}` +
    `<text x="${cx}" y="${cx-1}" text-anchor="middle" class="donut-num">${stats.total}</text>` +
    `<text x="${cx}" y="${cx+15}" text-anchor="middle" class="donut-cap">完成任务</text></svg>` +
    `<div class="legend">${legend}</div></div>`;
}

function tagBarsHTML(byTag) {
  const entries = Object.entries(byTag).sort((a,b) => b[1]-a[1]).slice(0, 8);
  if (!entries.length) return '<div class="chart-empty">今日无标签记录</div>';
  const top = entries[0][1];
  return entries.map(([tag, count], i) => {
    const [fg] = TAG_PALETTE[i % TAG_PALETTE.length];
    const pct = Math.round(count / top * 100);
    return `<div class="tbar-row"><span class="tbar-name" title="${esc(tag)}">${esc(tag)}</span>` +
      `<div class="tbar-track"><div class="tbar-fill" style="width:${pct}%;background:${fg}"></div></div>` +
      `<span class="tbar-val">${count}</span></div>`;
  }).join('');
}

function hourBarsHTML(slots) {
  const top = Math.max.apply(null, slots.concat([1]));
  return slots.map((count, i) => {
    const pct = count ? Math.max(3, Math.round(count / top * 100)) : 0;
    const [name, span] = HOUR_SLOTS[i];
    return `<div class="hbar-col${count ? '' : ' empty'}"><span class="hbar-val">${count}</span>` +
      `<div class="hbar" style="height:${pct}%"></div>` +
      `<span class="hbar-label">${name}<br>${span}</span></div>`;
  }).join('');
}

function switchReportTab(name) {
  document.querySelectorAll('.report-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  const overview = document.getElementById('report-page-overview');
  const detail = document.getElementById('report-page-detail');
  if (overview) overview.style.display = name === 'overview' ? '' : 'none';
  if (detail) detail.style.display = name === 'detail' ? '' : 'none';
}

  const total = calYear * 12 + calMonth - 1;

  calMonth = total % 12;

}
function calNext() {
  const total = calYear * 12 + calMonth + 1;

  calMonth = total % 12;
  renderCalendar();
}
function hideCalendar() {
  reportCalendarOpen = false;
  const cal = document.getElementById('report-calendar');
  const chevron = document.getElementById('cal-chevron');
  if (cal) cal.style.display = 'none';
  if (chevron) chevron.style.transform = '';
}
function toggleCalendar() {
  reportCalendarOpen = !reportCalendarOpen;
  const cal = document.getElementById('report-calendar');
  const chevron = document.getElementById('cal-chevron');
  if (reportCalendarOpen) {
    calYear = reportDate.getFullYear();
    calMonth = reportDate.getMonth();

  if (chevron) chevron.style.transform = reportCalendarOpen ? 'rotate(180deg)' : '';
}
function reportPrev() {
  reportDate = new Date(reportDate.getFullYear(), reportDate.getMonth(), reportDate.getDate() - 1);
  hideCalendar();
  updateReportNavDate();
  loadReportDay(fmtDate(reportDate));

function reportNext() {

function showModal(title, bodyHTML, buttons=[], opts={}) {
  let overlay = document.getElementById('modal-overlay');
  if (overlay) overlay.remove();
  overlay = document.createElement('div');
  overlay.id = 'modal-overlay';
  overlay.className = 'modal-overlay';
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
  const btnsHTML = buttons.map(b => {
    if (b.icon) {
      const cls = `icon-btn-sm${b.icon==='delete'?' danger':''}`;
      return `<span class="${cls}" data-icon="${b.icon}">${ICON_SVGS[b.icon]||''}</span>`;
    }
    return `<button class="btn${b.primary?' primary':''}">${b.text||''}</button>`;
  }).join('');
  overlay.innerHTML = `<div class="modal">
    <div style="display:flex;align-items:center;margin-bottom:16px"><h2 style="margin:0;flex:1">${title}</h2></div>
    <div class="modal-body">${bodyHTML}</div>
    <div class="actions">${btnsHTML}</div>
  </div>`;
  document.body.appendChild(overlay);
  const btnEls = overlay.querySelectorAll('.actions .btn, .actions .icon-btn-sm');
  btnEls.forEach((el, i) => {
    const b = buttons[i];
    el.onclick = async () => { if (b.handler) await b.handler(); if (b.action === 'close') closeModal(); };
  });
}
function closeModal() { const o = document.getElementById('modal-overlay'); if (o) o.remove(); }

function fmtDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseDate(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }

/* ================================================================
   窗口边缘拖拽调整大小
   ================================================================ */
const RESIZE_EDGE = 6;
const MIN_W = 600, MIN_H = 450;
let resizing = null;

function getResizeDir(e) {
  const w = window.innerWidth, h = window.innerHeight;
  const x = e.clientX, y = e.clientY;
  let dir = '';
  if (y < RESIZE_EDGE) dir += 'n';
  else if (y > h - RESIZE_EDGE) dir += 's';
  if (x < RESIZE_EDGE) dir += 'w';
  else if (x > w - RESIZE_EDGE) dir += 'e';
  return dir;
}

const CURSOR_MAP = {
  'n':'ns-resize','s':'ns-resize','e':'ew-resize','w':'ew-resize',
  'ne':'nesw-resize','sw':'nesw-resize','nw':'nwse-resize','se':'nwse-resize'
};

document.addEventListener('mousemove', e => {
  if (resizing) {
    const dx = e.screenX - resizing.sx;
    const dy = e.screenY - resizing.sy;
    let w = resizing.ow, h = resizing.oh;
    if (resizing.dir.includes('e')) w = resizing.ow + dx;
    if (resizing.dir.includes('s')) h = resizing.oh + dy;
    if (resizing.dir.includes('w')) w = resizing.ow - dx;
    if (resizing.dir.includes('n')) h = resizing.oh - dy;
    w = Math.max(MIN_W, w);
    h = Math.max(MIN_H, h);
    if (api) api.resize(w, h);
    e.preventDefault();
    return;
  }
  const dir = getResizeDir(e);
  document.body.style.cursor = dir ? (CURSOR_MAP[dir] || '') : '';
});

document.addEventListener('mousedown', e => {
  const dir = getResizeDir(e);
  if (!dir || e.button !== 0) return;
  resizing = {
    dir, sx: e.screenX, sy: e.screenY,
    ow: window.innerWidth, oh: window.innerHeight
  };
  e.preventDefault();
});

document.addEventListener('mouseup', () => {
  if (resizing) resizing = null;
});

/* ================================================================
   事件委托（替代 inline onclick，避免 CSP 问题）
   ================================================================ */
document.addEventListener('click', e => {
  const tagBtn = document.getElementById('tag-filter-btn');
  if (tagBtn && (e.target === tagBtn || tagBtn.contains(e.target))) {
    toggleTagPanel();
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  if (action === 'add') openAdd(parseInt(el.dataset.q) || 0);
  else if (action === 'add-task') openAdd();
  else if (action === 'report') openReport();
  else if (action === 'settings') openSettings();
  else if (action === 'lock') toggleLock();
  else if (action === 'quit') quitApp();
});

/* 键盘 Esc */
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
